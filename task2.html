<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2: Premium Gourmet Hub Studio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --border-line: rgba(15, 23, 42, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-glow: #ff4757;
            --accent-orange: #ffa502;
        }

        /* Toast Notification Style */
        #toast-box {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #2ecc71;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            display: none;
            z-index: 9999;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: opacity 0.5s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: all 0.25s ease;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        .store-header-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-line);
            z-index: 900;
            padding: 15px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-logo span {
            color: var(--accent-glow);
        }

        .search-control-box {
            position: relative;
            width: 35%;
        }

        .search-control-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border-radius: 30px;
            border: 1px solid var(--border-line);
            outline: none;
            font-family: inherit;
            font-size: 0.9rem;
            background: var(--bg-main);
        }

        .search-control-box::before {
            content: "🔍";
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.9rem;
            opacity: 0.6;
        }

        .nav-right-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .view-toggle-frame {
            display: flex;
            background: var(--bg-main);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border-line);
        }

        .view-btn {
            background: transparent;
            border: none;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .view-btn.active {
            background: #ffffff;
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .cart-trigger-pill {
            background: var(--text-primary);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .storefront-wrapper {
            max-width: 1300px;
            margin: 110px auto 40px auto;
            padding: 0 4%;
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 40px;
        }

        .side-category-rail {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: sticky;
            top: 110px;
            height: fit-content;
        }

        .rail-pill {
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            text-align: left;
        }

        .rail-pill:hover {
            background: rgba(15, 23, 42, 0.03);
            color: var(--text-primary);
        }

        .rail-pill.active {
            background: rgba(255, 71, 87, 0.08);
            color: var(--accent-glow);
        }

        .products-rendering-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .products-rendering-grid.list-view-active {
            grid-template-columns: 1fr !important;
        }

        .product-item-card {
            background: var(--bg-card);
            border: 1px solid var(--border-line);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.01);
        }

        .image-canvas-holder {
            height: 220px;
            background: #f1f5f9;
            position: relative;
            overflow: hidden;
        }

        .food-display-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-quickview-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
        }

        .product-item-card:hover .card-quickview-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        .quickview-trigger-btn {
            background: #ffffff;
            color: var(--text-primary);
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }

        .card-details-info {
            padding: 25px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .item-tag-badge {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--accent-orange);
            background: rgba(255, 165, 2, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 10px;
            text-transform: uppercase;
            align-self: flex-start;
        }

        .item-main-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .item-desc-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .card-footer-pricing {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-line);
            padding-top: 15px;
            margin-top: auto;
        }

        .price-lbl {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .add-to-cart-btn {
            background: rgba(255, 71, 87, 0.08);
            color: var(--accent-glow);
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .add-to-cart-btn:hover {
            background: var(--accent-glow);
            color: white;
        }

        .cart-slideover-drawer {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            height: 100%;
            background: #ffffff;
            box-shadow: -10px 0 40px rgba(15, 23, 42, 0.08);
            z-index: 1000;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .cart-slideover-drawer.drawer-open-active {
            right: 0;
        }

        .drawer-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-line);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .close-drawer-btn {
            font-size: 1.3rem;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .drawer-items-scroll-track {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cart-row-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-main);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--border-line);
        }

        .quantity-controller-cluster {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffffff;
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-line);
        }

        .qty-mutation-trigger {
            background: transparent;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .qty-numeric-val {
            font-size: 0.85rem;
            font-weight: 700;
            min-width: 15px;
            text-align: center;
        }

        .drawer-footer-checkout {
            border-top: 1px solid var(--border-line);
            padding-top: 20px;
            margin-top: 20px;
        }

        .checkout-total-row {
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 1.15rem;
            margin-bottom: 15px;
        }

        .checkout-submit-btn {
            width: 100%;
            background: var(--accent-glow);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }

        .modal-global-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            z-index: 1100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
        }

        .modal-global-backdrop.modal-open-active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card-node {
            background: #ffffff;
            max-width: 550px;
            width: 90%;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        .close-modal-trigger {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .empty-search-fallback {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>

    <div id="toast-box">Added to Cart! ✅</div>

    <header class="store-header-nav">
        <div class="brand-logo">Gourmet<span>Hub Studio</span></div>
        <div class="search-control-box">
            <input type="text" id="store-search-field" placeholder="Search culinary dishes instantly..."
                oninput="evaluateInstantSearchFilter()">
        </div>
        <div class="nav-right-actions">
            <div class="view-toggle-frame">
                <button id="grid-view-btn" class="view-btn active"
                    onclick="mutateStoreLayoutEngine('grid')">Grid</button>
                <button id="list-view-btn" class="view-btn" onclick="mutateStoreLayoutEngine('list')">List</button>
            </div>
            <button class="cart-trigger-pill" onclick="toggleCartDrawerState(true)">
                🛒 Cart <span id="global-cart-pill-counter"
                    style="background:#ffffff; color:var(--accent-glow); padding:2px 8px; border-radius:10px; font-size:0.75rem;">0</span>
            </button>
        </div>
    </header>

    <main class="storefront-wrapper">
        <aside class="side-category-rail">
            <div class="rail-pill active" onclick="switchStoreCategoryState('all', this)">All Categories</div>
            <div class="rail-pill" onclick="switchStoreCategoryState('appetizers', this)">Appetizers</div>
            <div class="rail-pill" onclick="switchStoreCategoryState('main course', this)">Main Course</div>
            <div class="rail-pill" onclick="switchStoreCategoryState('desserts', this)">Desserts</div>
        </aside>

        <section id="products-grid-host" class="products-rendering-grid"></section>
    </main>

    <div id="cart-drawer-node" class="cart-slideover-drawer">
        <div class="drawer-header-row">
            <h3 style="font-weight: 800; font-size: 1.2rem;">Your Selected Orders</h3>
            <button class="close-drawer-btn" onclick="toggleCartDrawerState(false)">✕</button>
        </div>
        <div id="cart-deck-host" class="drawer-items-scroll-track"></div>
        <div class="drawer-footer-checkout">
            <div class="checkout-total-row">
                <span>Total Valuation:</span>
                <span id="checkout-total-sum">₹0.00</span>
            </div>
            <button class="checkout-submit-btn"
                onclick="alert('Order Dispatched Successfully To Kitchen Engine Pipeline!')">Confirm Order
                Checkout</button>
        </div>
    </div>

    <div id="quickview-modal-backdrop" class="modal-global-backdrop" onclick="closeQuickviewModalPopup(event)">
        <div class="modal-card-node">
            <button class="close-modal-trigger" onclick="forceCloseModal()">✕</button>
            <span id="modal-item-badge" class="item-tag-badge">Category</span>
            <h2 id="modal-item-title" style="font-size:1.6rem; font-weight:800; margin-bottom:12px;">Product Title</h2>
            <p id="modal-item-desc" style="color:var(--text-secondary); font-size:1rem; margin-bottom:25px;">Description
                text.</p>
            <div
                style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border-line); padding-top:20px;">
                <div>
                    <p style="font-size:0.8rem; color:var(--text-secondary); font-weight:600;">ESTIMATED PRICE</p>
                    <span id="modal-item-price"
                        style="font-size:1.5rem; font-weight:800; color:var(--text-primary);">₹0.00</span>
                </div>
                <button id="modal-add-btn-node" class="checkout-submit-btn" style="width:auto; padding:12px 30px;">Add
                    To Order Deck</button>
            </div>
        </div>
    </div>

    <script>
        const foodProductsInventory = [
            { id: 101, title: "Crispy Avocado Bruschetta", category: "appetizers", price: 240, desc: "Toasted artisan sourdough bread smeared with rich creamy garlic avocado and vine-ripened tomatoes.", image: "https://images.unsplash.com/photo-1572695157366-5e585ab2b69f?w=500&auto=format&fit=crop&q=60" },
            { id: 102, title: "Truffle Glazed Mushrooms", category: "appetizers", price: 290, desc: "Wild forest mushrooms pan-seared in high-density Italian white truffle reduction glazes.", image: "https://images.unsplash.com/photo-1608897013039-887f21d8c804?w=500&auto=format&fit=crop&q=60" },
            { id: 103, title: "Smoked Salmon Crostini", category: "appetizers", price: 340, desc: "Premium thin-cut Norwegian smoked salmon layers resting on dill herbed cheese foundations.", image: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&auto=format&fit=crop&q=60" },
            { id: 201, title: "Wild Mushroom Risotto", category: "main course", price: 490, desc: "Slow-simmered rich Italian Arborio rice bound with Parmesan, cream, and complex herb profiles.", image: "https://images.unsplash.com/photo-1476124369491-e7addf5db371?w=500&auto=format&fit=crop&q=60" },
            { id: 202, title: "Flame Grilled Paneer Steak", category: "main course", price: 420, desc: "Thick cottage cheese slabs marinated in spicy coriander chimichurri sauces served on hot iron skillets.", image: "https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=500&auto=format&fit=crop&q=60" },
            { id: 203, title: "Artisan Neapolitan Pizza", category: "main course", price: 550, desc: "Hand-stretched thin crust dough topped with authentic buffalo mozzarella and fresh sweet basil leaves.", image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500&auto=format&fit=crop&q=60" },
            { id: 301, title: "Decadent Lava Soufflé", category: "desserts", price: 280, desc: "Warm rich dark chocolate crust holding a molten liquid core pool centers, served with vanilla beans ice cream.", image: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=500&auto=format&fit=crop&q=60" },
            { id: 302, title: "Matcha Panna Cotta", category: "desserts", price: 260, desc: "Silky smooth cold-set Japanese green tea cream pudding gelatin nodes balancing textures perfectly.", image: "https://images.unsplash.com/photo-1488477181946-6428a0291777?w=500&auto=format&fit=crop&q=60" }
        ];

        let activeFilteringCategory = "all";
        let globalShoppingCartState = [];

        // Function to show the Toast
        function showToast() {
            const toast = document.getElementById("toast-box");
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 2000);
        }

        function compileStorefrontDisplayGrid() {
            const gridHost = document.getElementById("products-grid-host");
            const searchInputString = document.getElementById("store-search-field").value.toLowerCase().trim();
            const processedFilteredResults = foodProductsInventory.filter(dish => {
                const matchCategory = (activeFilteringCategory === "all" || dish.category === activeFilteringCategory);
                const matchSearchText = (dish.title.toLowerCase().includes(searchInputString) || dish.desc.toLowerCase().includes(searchInputString));
                return matchCategory && matchSearchText;
            });

            if (processedFilteredResults.length === 0) {
                gridHost.innerHTML = `<div class="empty-search-fallback"><p style="font-size:1.3rem; font-weight:700;">No results found.</p></div>`;
                return;
            }

            gridHost.innerHTML = processedFilteredResults.map(item => `
                <div class="product-item-card">
                    <div class="image-canvas-holder">
                        <img src="${item.image}" alt="${item.title}" class="food-display-img">
                        <div class="card-quickview-overlay">
                            <button class="quickview-trigger-btn" onclick="executeOpenQuickviewModal(${item.id})">Quick View 👁️</button>
                        </div>
                    </div>
                    <div class="card-details-info">
                        <span class="item-tag-badge">${item.category}</span>
                        <h3 class="item-main-title">${item.title}</h3>
                        <p class="item-desc-text">${item.desc}</p>
                        <div class="card-footer-pricing">
                            <span class="price-lbl">₹${item.price}</span>
                            <button class="add-to-cart-btn" onclick="pushItemToShoppingCartEngine(${item.id})">Add To Cart</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function switchStoreCategoryState(targetCategoryKey, HTMLRefElement) {
            document.querySelectorAll('.rail-pill').forEach(pill => pill.classList.remove('active'));
            HTMLRefElement.classList.add('active');
            activeFilteringCategory = targetCategoryKey;
            compileStorefrontDisplayGrid();
        }

        function evaluateInstantSearchFilter() { compileStorefrontDisplayGrid(); }

        function mutateStoreLayoutEngine(targetModeStr) {
            const gridBtn = document.getElementById("grid-view-btn");
            const listBtn = document.getElementById("list-view-btn");
            const gridHostNode = document.getElementById("products-grid-host");
            gridBtn.classList.remove("active"); listBtn.classList.remove("active");
            if (targetModeStr === 'list') { listBtn.classList.add("active"); gridHostNode.classList.add("list-view-active"); }
            else { gridBtn.classList.add("active"); gridHostNode.classList.remove("list-view-active"); }
        }

        function pushItemToShoppingCartEngine(productId) {
            const targetedInventoryObject = foodProductsInventory.find(item => item.id === productId);
            const trackingMatchedCartRow = globalShoppingCartState.find(row => row.id === productId);

            if (trackingMatchedCartRow) { trackingMatchedCartRow.quantity++; }
            else { globalShoppingCartState.push({ id: targetedInventoryObject.id, title: targetedInventoryObject.title, price: targetedInventoryObject.price, quantity: 1 }); }

            showToast(); // Added toast trigger
            compileCartUIRendererDeck();
        }

        function modifyCartItemQuantityState(productId, transformationWeightInteger) {
            const targetedCartRowItem = globalShoppingCartState.find(row => row.id === productId);
            if (!targetedCartRowItem) return;
            targetedCartRowItem.quantity += transformationWeightInteger;
            if (targetedCartRowItem.quantity <= 0) globalShoppingCartState = globalShoppingCartState.filter(row => row.id !== productId);
            compileCartUIRendererDeck();
        }

        function compileCartUIRendererDeck() {
            const cartDeckHost = document.getElementById("cart-deck-host");
            const pillCounter = document.getElementById("global-cart-pill-counter");
            const checkoutTotalLbl = document.getElementById("checkout-total-sum");
            let accumulatedTotalSum = 0;
            let cumulativeUnitsCount = 0;

            if (globalShoppingCartState.length === 0) {
                cartDeckHost.innerHTML = `<div style="text-align:center; padding: 40px 10px;">Your order deck is empty.</div>`;
                pillCounter.innerText = 0; checkoutTotalLbl.innerText = "₹0.00";
                return;
            }

            cartDeckHost.innerHTML = globalShoppingCartState.map(item => {
                accumulatedTotalSum += (item.price * item.quantity);
                cumulativeUnitsCount += item.quantity;
                return `
                    <div class="cart-row-item">
                        <div class="cart-row-meta"><h4>${item.title}</h4><p>₹${item.price} × ${item.quantity}</p></div>
                        <div class="quantity-controller-cluster">
                            <button class="qty-mutation-trigger" onclick="modifyCartItemQuantityState(${item.id}, -1)">-</button>
                            <span class="qty-numeric-val">${item.quantity}</span>
                            <button class="qty-mutation-trigger" onclick="modifyCartItemQuantityState(${item.id}, 1)">+</button>
                        </div>
                    </div>`;
            }).join('');
            pillCounter.innerText = cumulativeUnitsCount;
            checkoutTotalLbl.innerText = `₹${accumulatedTotalSum.toFixed(2)}`;
        }

        function toggleCartDrawerState(forceOpenBoolean) {
            const drawerNode = document.getElementById("cart-drawer-node");
            if (forceOpenBoolean) drawerNode.classList.add("drawer-open-active");
            else drawerNode.classList.remove("drawer-open-active");
        }

        function executeOpenQuickviewModal(productId) {
            const matchedObject = foodProductsInventory.find(item => item.id === productId);
            if (!matchedObject) return;
            document.getElementById("modal-item-badge").innerText = matchedObject.category;
            document.getElementById("modal-item-title").innerText = matchedObject.title;
            document.getElementById("modal-item-desc").innerText = matchedObject.desc;
            document.getElementById("modal-item-price").innerText = `₹${matchedObject.price}`;
            document.getElementById("modal-add-btn-node").onclick = function () { pushItemToShoppingCartEngine(matchedObject.id); forceCloseModal(); };
            document.getElementById("quickview-modal-backdrop").classList.add("modal-open-active");
        }

        function forceCloseModal() { document.getElementById("quickview-modal-backdrop").classList.remove("modal-open-active"); }
        function closeQuickviewModalPopup(event) { if (event.target.id === "quickview-modal-backdrop") forceCloseModal(); }
        document.addEventListener("DOMContentLoaded", () => { compileStorefrontDisplayGrid(); compileCartUIRendererDeck(); });
    </script>
</body>

</html>
